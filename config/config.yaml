gdrive:
  url: "https://drive.google.com/file/d/19OT5RdY5As-8bALfxKeh2lNjB8ZPyOoP/view?usp=drive_link"
  upload_folder_id: null  # デフォルトアップロード先フォルダID（省略時は元ファイルと同じフォルダ）

whisper:
  model: Qwen/Qwen3-ASR-1.7B
  # 既定は自動言語判定(null)。明示的にja/en等を指定すると強制される。
  # 2026-08-03: 従来language: ja固定だったため、英語主体音声にja強制が
  # 適用され誤変換・内容縮退が実機で複数回観測されたため自動判定に変更。
  language: null
  device: cuda
  # 固有名詞・専門用語の認識ヒントファイル(Qwen3-ASR用)。1行1語彙、#はコメント。
  # 書式サンプル: config/context_hints.txt.sample を参照。
  # ファイル不存在/空の場合はヒントなし(後方互換)。
  context_file: "config/context_hints.txt"
  # タイムスタンプ付与(Qwen3-ASR専用、オプトイン)。trueにするとForcedAligner
  # (Qwen/Qwen3-ForcedAligner-0.6B、初回利用時に追加ダウンロード・GPUメモリ
  # 約1.2GB追加)を読み込み、出力テキストの各行頭に[MM:SS]を付与する。
  # 既定はfalse(既存の出力形式を維持)。
  include_timestamps: false
